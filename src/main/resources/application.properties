# 1. Endereço do Banco (URL): Protocolo : Banco : Porta / NomeDoBanco
spring.datasource.url=jdbc:mysql://localhost:3306/spring_aula?createDatabaseIfNotExist=true&serverTimezone=UTC

# 2. Credenciais de Acesso (Cuidado com espaços!)
spring.datasource.username=felipe
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=validate
# 4. Debug: Mostra o SQL que o Spring está gerando no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true